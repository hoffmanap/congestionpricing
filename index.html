<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MTA Congestion Relief Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">MTA Congestion Relief Zone</h1>
            <select id="timeFilter" onchange="render()" class="mt-4 p-2 border rounded shadow-sm">
                <option value="dow">Average by Day of Week</option>
                <option value="tod">Time of Day (Hourly)</option>
            </select>
        </header>
        <div class="bg-white p-6 rounded-xl shadow-sm border">
            <canvas id="mtaChart" height="100"></canvas>
        </div>
    </div>

    <script>
        let cachedData = [];

        async function init() {
            const res = await fetch('./data.json');
            cachedData = await res.json();
            render();
        }

        function render() {
            const filter = document.getElementById('timeFilter').value;
            const ctx = document.getElementById('mtaChart').getContext('2d');
            
            // Map data using correct field names from your snippet
            const processed = cachedData.map(d => ({
                dateObj: new Date(d.toll_hour), // Corrected field
                entries: parseInt(d.crz_entries) || 0
            }));

            let labels, values;

            if (filter === 'dow') {
                const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                const summary = processed.reduce((acc, row) => {
                    const d = days[row.dateObj.getDay()];
                    acc[d] = (acc[d] || 0) + row.entries;
                    return acc;
                }, {});
                labels = days;
                values = days.map(d => summary[d] || 0);
            } else {
                // Aggregating by hour (0-23)
                const summary = processed.reduce((acc, row) => {
                    const hr = row.dateObj.getHours();
                    acc[hr] = (acc[hr] || 0) + row.entries;
                    return acc;
                }, {});
                labels = Array.from({length: 24}, (_, i) => `${i}:00`);
                values = Array.from({length: 24}, (_, i) => summary[i] || 0);
            }

            if (window.myChart instanceof Chart) window.myChart.destroy();
            window.myChart = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets: [{ label: 'Total CRZ Entries', data: values, backgroundColor: '#2563eb' }] }
            });
        }
        init();
    </script>
</body>
</html>
