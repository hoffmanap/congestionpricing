<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MTA Congestion Relief Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">MTA Congestion Relief Zone</h1>
            <select id="timeFilter" onchange="render()" class="mt-4 p-2 border rounded shadow-sm">
                <option value="dow">Average by Day of Week</option>
                <option value="monthly">Monthly Trend</option>
            </select>
        </header>
        <div class="bg-white p-6 rounded-xl shadow-sm border">
            <canvas id="mtaChart" height="100"></canvas>
        </div>
    </div>

    <script>
        let cachedData = [];

        async function init() {
            const res = await fetch('./data.json');
            cachedData = await res.json();
            render();
        }

        function render() {
            const filter = document.getElementById('timeFilter').value;
            const ctx = document.getElementById('mtaChart').getContext('2d');
            
            const processed = cachedData.map(d => ({
                dateObj: new Date(d.date),
                entries: parseInt(d.crz_entries) || 0
            }));

            let labels, values;

            if (filter === 'dow') {
                const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                const summary = processed.reduce((acc, row) => {
                    const d = days[row.dateObj.getDay()];
                    acc[d] = (acc[d] || 0) + row.entries;
                    return acc;
                }, {});
                labels = days;
                values = days.map(d => summary[d] || 0);
            } else {
                // Simple Monthly Aggregation
                const months = {};
                processed.forEach(r => {
                    const m = r.dateObj.toLocaleString('default', { month: 'short' });
                    months[m] = (months[m] || 0) + r.entries;
                });
                labels = Object.keys(months);
                values = Object.values(months);
            }

            if (window.myChart instanceof Chart) window.myChart.destroy();
            window.myChart = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets: [{ label: 'Entries', data: values, borderColor: '#2563eb', fill: true }] }
            });
        }
        init();
    </script>
</body>
</html>
