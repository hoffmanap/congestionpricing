<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTA Mobility Benchmark Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-gray-900">Congestion Zone: Historical Benchmarking</h1>
        
        <div class="flex gap-4 mb-6 bg-white p-4 rounded-lg shadow-sm border flex-wrap">
            <select id="yearFilter" onchange="updateFilters()" class="p-2 border rounded"></select>
            <select id="monthFilter" onchange="updateFilters()" class="p-2 border rounded"></select>
            <select id="regionFilter" onchange="updateFilters()" class="p-2 border rounded"></select>
            <select id="benchmarkFilter" onchange="render()" class="p-2 border rounded border-red-300">
                <option value="">Select Benchmark Date...</option>
            </select>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border">
            <canvas id="mtaChart" height="100"></canvas>
        </div>
    </div>

    <script>
        let cachedData = [];

        async function init() {
            try {
                // Fetch the historical archive
                const res = await fetch('./data_archive.json');
                cachedData = await res.json();
                
                const years = [...new Set(cachedData.map(r => String(r.year)))].sort((a,b) => b-a);
                const yearSel = document.getElementById('yearFilter');
                years.forEach(y => yearSel.add(new Option(y, y)));
                
                updateFilters();
            } catch (err) {
                console.error("Initialization failed:", err);
            }
        }

        function updateFilters() {
            const y = document.getElementById('yearFilter').value;
            
            // Update Months
            const months = [...new Set(cachedData.filter(r => String(r.year) === y).map(r => r.month))];
            const mSel = document.getElementById('monthFilter');
            mSel.innerHTML = '';
            months.forEach(m => mSel.add(new Option(m, m)));
            
            // Update Regions
            const regions = [...new Set(cachedData.map(r => r.detection_region))];
            const rSel = document.getElementById('regionFilter');
            rSel.innerHTML = '';
            regions.forEach(r => rSel.add(new Option(r, r)));

            // Update Benchmark Dates
            const bSel = document.getElementById('benchmarkFilter');
            const dates = [...new Set(cachedData.map(r => r.date_str))].sort((a,b) => b.localeCompare(a));
            bSel.innerHTML = '<option value="">Select Benchmark Date...</option>';
            dates.forEach(d => bSel.add(new Option(d, d)));
            
            render();
        }

        function render() {
            const y = document.getElementById('yearFilter').value;
            const m = document.getElementById('monthFilter').value;
            const r = document.getElementById('regionFilter').value;
            const bDate = document.getElementById('benchmarkFilter').value;
            
            if (!y || !m || !r) return;

            const filtered = cachedData.filter(d => 
                String(d.year) === String(y) && d.month === m && d.detection_region === r
            );

            const ctx = document.getElementById('mtaChart').getContext('2d');
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const colors = ['#f87171', '#fb923c', '#fbbf24', '#4ade80', '#22d3ee', '#818cf8', '#e879f9'];

            const datasets = days.map((day, i) => ({
                label: day,
                data: Array.from({length: 24}, (_, h) => {
                    const row = filtered.find(r => r.day === day && r.hour === h);
                    return row ? row.crz_entries : 0;
                }),
                borderColor: colors[i], borderWidth: 1, fill: false, tension: 0.3
            }));

            // Add selected Benchmark line if a date is chosen
            if (bDate) {
                datasets.push({
                    label: `Benchmark: ${bDate}`,
                    data: Array.from({length: 24}, (_, h) => {
                        // Searching 'cachedData' (the whole archive) to find the benchmark
                        const row = cachedData.find(item => 
                            item.date_str === bDate && 
                            item.hour === h && 
                            item.detection_region === r
                        );
                        return row ? row.crz_entries : 0;
                    }),
                    borderColor: '#e11d48', borderWidth: 3, borderDash: [5, 5], fill: false
                });
            }

            if (window.myChart instanceof Chart) window.myChart.destroy();
            window.myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: Array.from({length: 24}, (_, i) => `${i}:00`), datasets },
                options: {
                    responsive: true,
                    scales: {
                        y: { title: { display: true, text: 'Number of Entries' }, beginAtZero: true },
                        x: { title: { display: true, text: 'Hour of Day' } }
                    }
                }
            });
        }
        init();
    </script>
</body>
</html>
