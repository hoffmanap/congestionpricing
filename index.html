<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTA Mobility Benchmark Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-gray-900">Congestion Zone: Hourly Benchmarking</h1>
        
        <div class="flex gap-4 mb-6 bg-white p-4 rounded-lg shadow-sm border flex-wrap">
            <select id="yearFilter" onchange="updateMonthOptions()" class="p-2 border rounded"></select>
            <select id="monthFilter" onchange="updateRegionOptions()" class="p-2 border rounded"></select>
            <select id="regionFilter" onchange="render()" class="p-2 border rounded"></select>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border">
            <canvas id="mtaChart" height="100"></canvas>
        </div>
    </div>

    <script>
        let cachedData = [];

        async function init() {
            try {
                const res = await fetch('./summary.json');
                cachedData = await res.json();
                
                // Populate Year
                const years = [...new Set(cachedData.map(r => String(r.year)))].sort((a,b) => b-a);
                const yearSel = document.getElementById('yearFilter');
                years.forEach(y => yearSel.add(new Option(y, y)));
                
                updateMonthOptions();
            } catch (err) {
                console.error("Initialization failed:", err);
            }
        }

        function updateMonthOptions() {
            const y = document.getElementById('yearFilter').value;
            const months = [...new Set(cachedData.filter(r => String(r.year) === y).map(r => r.month))];
            const sel = document.getElementById('monthFilter');
            sel.innerHTML = '';
            months.forEach(m => sel.add(new Option(m, m)));
            updateRegionOptions();
        }

        function updateRegionOptions() {
            const y = document.getElementById('yearFilter').value;
            const m = document.getElementById('monthFilter').value;
            const regions = [...new Set(cachedData.filter(r => String(r.year) === y && r.month === m).map(r => r.detection_region))];
            const sel = document.getElementById('regionFilter');
            sel.innerHTML = '';
            regions.forEach(r => sel.add(new Option(r, r)));
            render();
        }

        function render() {
            const y = document.getElementById('yearFilter').value;
            const m = document.getElementById('monthFilter').value;
            const r = document.getElementById('regionFilter').value;
            
            const filtered = cachedData.filter(d => 
                String(d.year) === y && 
                d.month === m && 
                d.detection_region === r
            );

            const ctx = document.getElementById('mtaChart').getContext('2d');
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const colors = ['#94a3b8', '#94a3b8', '#94a3b8', '#94a3b8', '#94a3b8', '#94a3b8', '#94a3b8'];

            // Find most recent date from filtered set
            const dates = [...new Set(filtered.map(r => r.date_str))].sort();
            const benchmarkDate = dates.length > 0 ? dates[dates.length - 1] : "No Data";

            const datasets = days.map((day, i) => ({
                label: day,
                data: Array.from({length: 24}, (_, h) => {
                    const row = filtered.find(r => r.day === day && r.hour === h);
                    return row ? row.crz_entries : 0;
                }),
                borderColor: colors[i], borderWidth: 1, fill: false, tension: 0.3
            }));

            // Add Benchmark
            datasets.push({
                label: `Benchmark: ${benchmarkDate}`,
                data: Array.from({length: 24}, (_, h) => {
                    const row = filtered.find(r => r.date_str === benchmarkDate && r.hour === h);
                    return row ? row.crz_entries : 0;
                }),
                borderColor: '#e11d48', borderWidth: 3, borderDash: [5, 5], fill: false
            });

            if (window.myChart instanceof Chart) window.myChart.destroy();
            window.myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: Array.from({length: 24}, (_, i) => `${i}:00`), datasets },
                options: {
                    responsive: true,
                    scales: {
                        y: { title: { display: true, text: 'Number of Entries' }, beginAtZero: true },
                        x: { title: { display: true, text: 'Hour of Day' } }
                    }
                }
            });
        }
        init();
    </script>
</body>
</html>
