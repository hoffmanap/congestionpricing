<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MTA Mobility Benchmark Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-gray-900">Congestion Zone: Hourly Benchmarking</h1>
        
        <div class="flex gap-4 mb-6">
            <select id="regionFilter" onchange="render()" class="p-2 border rounded shadow-sm w-64"></select>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border">
            <canvas id="mtaChart"></canvas>
        </div>
    </div>

    <script>
        let cachedData = [];

        async function init() {
            try {
                const res = await fetch('./summary.json');
                cachedData = await res.json();
                
                // Populate region filter dynamically
                const regionSelect = document.getElementById('regionFilter');
                const regions = [...new Set(cachedData.map(r => r.detection_region))].sort();
                regions.forEach(reg => {
                    const opt = document.createElement('option');
                    opt.value = reg; opt.textContent = reg;
                    regionSelect.appendChild(opt);
                });
                render();
            } catch (err) {
                console.error("Failed to load data:", err);
            }
        }

        function render() {
            const region = document.getElementById('regionFilter').value;
            if (!region) return;

            const filtered = cachedData.filter(r => r.detection_region === region);
            const ctx = document.getElementById('mtaChart').getContext('2d');
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const colors = ['#94a3b8', '#94a3b8', '#94a3b8', '#94a3b8', '#94a3b8', '#94a3b8', '#94a3b8']; // Muted for baseline

            // Get benchmark date (most recent in data)
            const dates = [...new Set(filtered.map(r => r.date_str))].sort();
            const benchmarkDate = dates[dates.length - 1];

            const datasets = days.map((day, i) => ({
                label: day,
                data: Array.from({length: 24}, (_, h) => {
                    const row = filtered.find(r => r.day === day && r.hour === h);
                    return row ? row.crz_entries : 0;
                }),
                borderColor: colors[i],
                borderWidth: 1,
                fill: false, tension: 0.3
            }));

            // Add Benchmark: Most Recent Day (Highlighted)
            datasets.push({
                label: `Benchmark: ${benchmarkDate}`,
                data: Array.from({length: 24}, (_, h) => {
                    const row = filtered.find(r => r.date_str === benchmarkDate && r.hour === h);
                    return row ? row.crz_entries : 0;
                }),
                borderColor: '#e11d48', borderWidth: 3, borderDash: [5, 5], fill: false
            });

            if (window.myChart instanceof Chart) window.myChart.destroy();
            window.myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: Array.from({length: 24}, (_, i) => `${i}:00`), datasets },
                options: {
                    responsive: true,
                    scales: {
                        y: { title: { display: true, text: 'Number of Entries' }, beginAtZero: true },
                        x: { title: { display: true, text: 'Hour of Day' } }
                    }
                }
            });
        }
        init();
    </script>
</body>
</html>
