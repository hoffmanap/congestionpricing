<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MTA Mobility Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Congestion Zone: Hourly Benchmarking</h1>
        <div class="bg-white p-6 rounded-xl shadow-sm border">
            <canvas id="mtaChart" height="100"></canvas>
        </div>
    </div>
    <script>
        async function init() {
            const res = await fetch('./summary.json');
            const data = await res.json();
            const ctx = document.getElementById('mtaChart').getContext('2d');
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const colors = ['#f87171', '#fb923c', '#fbbf24', '#4ade80', '#22d3ee', '#818cf8', '#e879f9'];
            
            const datasets = days.map((day, i) => ({
                label: day,
                data: Array.from({length: 24}, (_, h) => {
                    const row = data.find(r => r.day === day && r.hour === h);
                    return row ? row.crz_entries : 0;
                }),
                borderColor: colors[i],
                fill: false, tension: 0.3
            }));

            new Chart(ctx, {
                type: 'line',
                data: { labels: Array.from({length: 24}, (_, i) => `${i}:00`), datasets },
                options: { responsive: true }
            });
        }
        init();
    </script>
</body>
</html>
