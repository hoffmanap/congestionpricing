<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MTA Congestion Relief Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-4">MTA Congestion Relief Data</h1>
        <div id="status" class="text-sm text-gray-500 mb-4">Loading local data...</div>
        <div class="bg-white p-6 rounded-lg shadow-sm border"><canvas id="mtaChart"></canvas></div>
    </div>

    <script>
        async function loadLocalData() {
            try {
                // Now fetching the local file generated by the GitHub Action
                const response = await fetch('./data.json');
                const data = await response.json();
                document.getElementById('status').textContent = `Loaded ${data.length} records.`;
                render(data);
            } catch (err) {
                document.getElementById('status').innerHTML = `<span class="text-red-600">Could not load data.json</span>`;
            }
        }

        function render(data) {
            const ctx = document.getElementById('mtaChart').getContext('2d');
            const summary = data.reduce((acc, row) => {
                const cls = row.vehicle_class || "Unknown";
                acc[cls] = (acc[cls] || 0) + (parseInt(row.crz_entries) || 0);
                return acc;
            }, {});

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(summary),
                    datasets: [{ label: 'CRZ Entries', data: Object.values(summary), backgroundColor: '#2563eb' }]
                }
            });
        }
        loadLocalData();
    </script>
</body>
</html>
