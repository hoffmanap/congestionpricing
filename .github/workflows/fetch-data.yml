name: Fetch and Summarize MTA Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Determine fetch start date
        id: start
        run: |
          python3 - <<'PY'
          import json, os

          try:
              with open('data_archive.json') as f:
                  data = json.load(f)
          except FileNotFoundError:
              data = []

          if data:
              start_date = max(r['date_str'] for r in data)
          else:
              start_date = '2025-01-01'

          with open(os.environ['GITHUB_OUTPUT'], 'a') as gh:
              gh.write(f"start_date={start_date}\n")

          print(f"Fetching data from {start_date} onward")
          PY

      - name: Fetch and Summarize
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          # Paginates through the full backlog instead of one request,
          # so a single run can catch all the way up to the present
          # even when the vehicle-class breakdown means there's more
          # than ~50,000 rows of backlog to work through.
          python fetch_data.py "$API_KEY" "${{ steps.start.outputs.start_date }}"
          python summarize.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          git add -f data_archive.json

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated update of data_archive.json"
            git push origin main
          fi

