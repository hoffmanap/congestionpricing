name: Deploy Dashboard
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Inject Secret
        shell: bash
        env:
          API_KEY_SECRET: ${{ secrets.API_KEY }}
        run: |
          # Use envsubst to replace ${API_KEY_SECRET} in the file
          envsubst '${API_KEY_SECRET}' < index.html > index.tmp && mv index.tmp index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
