name: Fetch MTA Data
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Fetch Data
        run: |
          curl -H "X-App-Token: ${{ secrets.API_KEY }}" \
          'https://data.ny.gov/resource/t6yz-b64h.json?$limit=5000' > data.json
      - name: Commit and Push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          if [[ -n $(git status -s) ]]; then
            git add data.json
            git commit -m "Update MTA data: $(date)"
            git push
          fi
