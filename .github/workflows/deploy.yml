name: Deploy Dashboard
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Inject Secret
        shell: bash
        env:
          # This maps your GitHub Secret to an environment variable
          API_KEY_SECRET: ${{ secrets.API_KEY }}
        run: |
          # Use | as the delimiter to avoid issues with potential symbols in your key
          sed -i "s|REPLACE_WITH_SECRET_TOKEN|$API_KEY_SECRET|g" index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
